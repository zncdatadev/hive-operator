---
apiVersion: hive.kubedoop.dev/v1alpha1
kind: HiveMetastore
metadata:
  name: test-hive
spec:
  image:
    productVersion: ($values.product_version)
  clusterConfig:
    database:
      databaseType: derby
      connString: jdbc:derby:;databaseName=metastore_db;create=true
      credentialsSecret: hive-credentials
  metastore:
    roleGroups:
      primary:
        replicas: 1
      # secondary is removed: the operator must reclaim its resources.
